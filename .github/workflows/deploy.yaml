name: Deploy Quartz site to GitHub Pages

# 觸發時機：
# - push 去呢個repo自己嘅 main（例如改 Quartz 設定）
# - 排程每 30 分鐘檢查一次，攞返 ToCC-Wiki（私有內容repo）最新 merge 咗嘅內容重新 build
#   （用排程而非即時cross-repo trigger，換取零改動 ToCC-Wiki 嘅簡單性，可接受最多30分鐘延遲）
# - 手動 workflow_dispatch，方便測試
on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site (Quartz framework)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 內容來自另一個 private repo（othersakura/ToCC-Wiki），需要一個有讀取權限的
      # token 先 checkout 到（見 CONTENT_REPO_TOKEN secret，未設定前呢步會失敗，
      # 唔會有內容外洩，只係build失敗）。
      - name: Checkout content (private ToCC-Wiki repo)
        uses: actions/checkout@v7
        with:
          repository: othersakura/ToCC-Wiki
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: content

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install Dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
